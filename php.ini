; Custom PHP settings for Heroku/Dokku.
;
; NOTE: this applies at RUNTIME (FPM / web dynos) only. It does NOT apply to the
; build, where `composer install` runs its post-install-cmd scripts under the
; buildpack's own PHP at the 128M default -- which is why a deploy can OOM in
; cache:clear while this file says 512M. Anything run during the build, or as a
; worker/cron, carries its own `php -d memory_limit=...` instead; see the
; auto-scripts block in composer.json, Procfile, and app.json's cron entries.
memory_limit = 512M
