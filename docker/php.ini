; Runtime overrides for the FrankenPHP image. FrankenPHP embeds PHP directly
; (not php-fpm/php-cgi), so the buildpack-era fpm_custom.conf and .user.ini are
; not picked up -- these go in conf.d instead.

; mediary decodes and derives images (imagick) and handles multi-page PDFs.
memory_limit=768M
upload_max_filesize=512M
post_max_size=512M
max_execution_time=120

; REQUIRED, not tuning: cache.yaml uses cache.adapter.apcu, and mediary's eleven
; worker process types are all CLI (messenger:consume). APCu is disabled in CLI by
; default, so without this every worker silently runs with a non-functional app
; cache while the web container's works fine.
apc.enable_cli=1
apc.shm_size=128M

; Long-lived process, so the opcache is warm across requests instead of being
; rebuilt per request as under php-fpm. This is the reason for the migration.
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
