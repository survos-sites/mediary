; Shared runtime overrides for FPM and Messenger's CLI processes.

; mediary decodes and derives images (imagick) and handles multi-page PDFs.
memory_limit=768M
upload_max_filesize=512M
post_max_size=512M
max_execution_time=120

; REQUIRED, not tuning: cache.yaml uses cache.adapter.apcu, and mediary's eleven
; worker process types are all CLI (messenger:consume). APCu is disabled in CLI by
; default, so without this every worker silently runs with a non-functional app
; cache while the web container's works fine.
apc.enable_cli=1
apc.shm_size=128M

; FPM workers share the opcode cache across requests.
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
