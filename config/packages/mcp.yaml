# Scoped to dev/test to match config/bundles.php -- this config is loaded
# unconditionally otherwise and breaks the prod build ("no extension able to load
# the configuration for mcp").
#
# mcp-bundle 0.13 replaced the single implicit server (`app` + `client_transports`)
# with named `servers` (what we expose) and `clients` (servers we connect out to).
# We only expose one, so the `mediary` key supplies the name the old `app` did.
#
# http transport is what a local agent/MCP client needs; stdio is for a CLI-spawned
# server, which we don't use. Both are opt-in per server, and with neither enabled
# RouteLoader registers no route at all -- which is why debug:router can show nothing
# even though the bundle is installed.
#
# `path` is pinned because 0.13 moved the default from /_mcp to /mcp/<name>; /_mcp is
# what README.md, doc/JSONRPC.md and existing client config all point at.
when@dev: &mcp
    mcp:
        servers:
            mediary:
                # 0.13 makes a server declare what it exposes; 0.12 published everything
                # it discovered, and "*" is that same behaviour. The tools come from
                # bundles (survos/meili-bundle's five, incl. meili_search_index), not
                # from src/ -- no app class carries an MCP attribute.
                registry: '*'
                transports:
                    http: true
                http:
                    path: /_mcp
                    # DNS-rebinding protection defaults to localhost only, so every request
                    # through the symfony proxy (https://mediary.wip/_mcp) came back
                    # "403 Forbidden: Invalid Host header". Allow the dev hostname too.
                    allowed_hosts: ['mediary.wip', 'localhost', '127.0.0.1']

when@test: *mcp
