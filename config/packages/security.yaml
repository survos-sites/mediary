security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    #
    # Deny by default, same shape as harvest: everything needs ROLE_USER except the
    # endpoints that MACHINES call. mediary is mostly a machine API, so getting the
    # carve-outs right is the whole job -- a missing one silently breaks a client
    # that has no human to see the login page, and the symptom is a redirect to
    # /login parsed as a failed upload.
    access_control:
        # THE dispatch endpoint. media-bundle's MediaBatchDispatcher POSTs
        # <endpoint>/<client>/batch -- harvest sends /harvest/batch, ssai /ssai/batch.
        # Public but NOT unauthenticated in practice: payloads are client-scoped and
        # the asset.analyzed callback is HMAC-signed (MEDIARY_WEBHOOK_SECRET).
        # Regex is anchored so it cannot be widened by a longer path.
        - { path: '^/[^/]+/batch$', roles: PUBLIC_ACCESS }
        # dokku CHECKS and uptime monitoring hit this with no credentials.
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # Everything else -- UI, EasyAdmin, and the API Platform surface under /api --
        # requires a login. Gate /api deliberately: nothing currently consumes it
        # machine-to-machine (clients use /<client>/batch), but if that changes it
        # needs a token authenticator, not a PUBLIC_ACCESS hole.
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
