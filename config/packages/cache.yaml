framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        # Explicit here because the local Redis (survos_redis, ~/sites/docker) is shared
        # with every other app on this box -- without a stable seed the namespace is
        # derived from the container class hash and churns on every cache:clear.
        prefix_seed: survos/mediary

        # Redis -- the "app" pool also backs doctrine.result_cache_pool (see
        # doctrine.yaml), so the ORM result cache survives across workers and
        # requests instead of living in per-process filesystem files. That is the
        # immediate win; mediary runs many long-lived workers over the same rows.
        # Dokku's dokku-redis addon injects REDIS_URL in production; locally it
        # points at the shared dev stack's redis container, see .env.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null
