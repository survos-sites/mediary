framework:
    messenger:
# config/packages/messenger.yaml
        default_bus: messenger.bus.default
#        buses:
#            messenger.bus.default:
#                # we control the full stack to guarantee ordering
#                middleware:
#                    - dispatch_after_current_bus
##                    - Survos\StateBundle\Messenger\Middleware\DynamicRoutingMiddleware  # <— BEFORE send_message
#                    - failed_message_processing_middleware
#                    - send_message

        failure_transport: failed
        transports:
            # These stay on Doctrine, matching packages. The AMQP move here is state-bundle's
            # per-transition dynamic queues (survos_state.queue_driver: rabbitmq), which use
            # jwage/phpamqplib-messenger's dsn/vhost/exchange convention -- NOT the
            # `options: queue_name:` trick, which is Doctrine's shared-table mechanism and
            # means nothing to an AMQP transport.
            #
            # Two env vars on purpose: MESSENGER_TRANSPORT_DSN is the broker,
            # DOCTRINE_MESSENGER_TRANSPORT_DSN is kept defined alongside it so any single
            # transport can be flipped back to Doctrine for debugging without touching
            # anything else.
            meili:
                dsn: '%env(DOCTRINE_MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: meili
            cache_warm:
                dsn: '%env(DOCTRINE_MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: cache_warm
            # STAYS on Doctrine on purpose. A failed message is one you want to look at and
            # retry, and under AMQP it is invisible both to `messenger:failed:*` and to
            # zenstruck/messenger-monitor. Same choice packages and lingua made.
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'
            # Outbound asset.analyzed notifications. Its own queue for two reasons: a
            # `media:replay-webhooks` backfill enqueues hundreds of thousands of these and must
            # not bury the meili or cache_warm queues behind them, and delivery is the one kind
            # of work here that depends on someone else's uptime — so it is the one that will
            # sit in retry, and that has to be drainable (and pausable) on its own.
            # On AMQP: `media:replay-webhooks` enqueues hundreds of thousands of these, which is
            # exactly the burst Doctrine handles badly. The trade is visibility -- under AMQP
            # these are no longer rows you can select, and on 2026-08-18 that is precisely how
            # 76 undelivered callbacks were spotted (`messenger:stats` showed the depth). The
            # management UI on :15672 now covers depth; what is genuinely lost is per-message
            # payload and retry-count inspection. `failed` stays on Doctrine, so anything that
            # gives up for good is still a row.
            webhook:
                # The trailing path segment is the EXCHANGE name (jwage's convention is
                # phpamqplib://user:pass@host:port/<vhost>/<exchange>). Without it the transport
                # falls back to an exchange+queue literally called `messages`, which defeats the
                # point of giving webhooks their own drainable, pausable queue -- and would
                # collide with any other transport on this vhost that also omitted it.
                dsn: '%env(MESSENGER_TRANSPORT_DSN_RABBITMQ)%/webhook'
                options:
                    delay:
                        # REQUIRED for the retry_strategy below to work at all. Without it
                        # jwage/phpamqplib-messenger declares its delay queue transient +
                        # non-exclusive, which RabbitMQ 4.3 denies by default
                        # (`transient_nonexcl_queues`): the broker answers INTERNAL_ERROR and
                        # CLOSES the connection, so the first retried webhook kills
                        # messenger:consume outright and the restart policy turns that into a
                        # crash loop with nothing in the logs pointing at the delay queue
                        # (harvest hit this: 7,035 restarts, 2,229 messages frozen). This
                        # transport was exposed the whole time it has been on AMQP -- the retry
                        # policy below is exactly the trigger. Opt-in flag from
                        # jwage/phpamqplib-messenger#124 (merged 2026-08-25, untagged; see the
                        # dev-main constraint in composer.json). x-expires still cleans the
                        # delay queues up -- durable does not change that.
                        durable: true
                retry_strategy:
                    # A subscriber restarting during a deploy is the common failure; give it
                    # minutes, not seconds. 4xx never gets here — VerifyingWebhookTransport
                    # raises those as unrecoverable so they go straight to `failed`.
                    max_retries: 5
                    delay: 5000
                    multiplier: 4
                    max_delay: 3600000

        routing:
#            Survos\StorageBundle\Message\DirectoryListingMessage: listing
            Survos\MeiliBundle\Message\BatchIndexEntitiesMessage: meili
            App\Message\WarmImgproxyCacheMessage: cache_warm
            # Symfony's own message, dispatched by App\Service\AssetNotifier::notify().
            Symfony\Component\Webhook\Messenger\SendWebhookMessage: webhook
