# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Trust chain is environment-driven so production can include Cloudflare
    # and/or edge proxy CIDRs. Keep defaults strict in .env.
    trusted_proxies: '%env(SYMFONY_TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Note that the session will be started ONLY if you read or write from it.
    session: true
    router:
        default_uri: 'https://mediary.survos.com'

    #esi: true
    #fragments: true
    http_client:
        default_options:
            max_redirects: 8
            timeout: 30
            # idle_timeout: how long to wait with no data received.
            # Vision tasks (enrich_from_thumbnail) can take 45-60s for OpenAI to process.
            # The default (60s) is too low — raise it.
            proxy: '%env(HTTP_PROXY)%'
            # HTTP_PROXY is the Symfony CLI proxy, and it exists so mediary can
            # resolve *.wip names in dev. Sending everything through it broke the
            # thing mediary does most: fetching an image to analyse. An imgproxy
            # URL on this same machine (127.0.0.1:8080) went out through the proxy
            # and came back 407 Proxy Authentication Required, surfacing as
            # "Error while downloading file. Upstream status code: 407" -- which
            # reads like the image server rejected us, not like we never asked it.
            no_proxy: '%env(default:no_proxy_default:NO_PROXY)%'

#    error_controller: App\Controller\ErrorController::show

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@dev:
    framework:
        router:
            default_uri: 'https://media.wip'
