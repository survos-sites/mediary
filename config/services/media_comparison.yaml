parameters:
    # Per million tokens, USD; synchronous rates. Batch figures in reports are projections.
    # Keep profiles explicit: aliases can change model/tokenization without notice.
    media_comparison.models:
        openai-mini: &openai_mini
            provider: openai
            model: gpt-4o-mini
            endpoint: https://api.openai.com/v1/chat/completions
            api_key: '%env(default::OPENAI_API_KEY)%'
            input_per_million: 0.15
            cached_input_per_million: 0.075
            output_per_million: 0.60
            pricing_date: '2026-10-06'
        openai-mini-json:
            <<: *openai_mini
            response_format: { type: json_object }
        gemini-flash-lite:
            provider: gemini
            transport: gemini
            model: gemini-2.5-flash-lite
            endpoint: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent
            api_key: '%env(default:media_comparison.google_key:GEMINI_API_KEY)%'
            input_per_million: 0.10
            cached_input_per_million: 0.01
            output_per_million: 0.40
            pricing_date: '2026-10-06'
        ministral-8b: &ministral_8b
            provider: mistral
            model: ministral-8b-2512
            endpoint: https://api.mistral.ai/v1/chat/completions
            api_key: '%env(default::MISTRAL_API_KEY)%'
            input_per_million: 0.15
            cached_input_per_million: 0.015
            output_per_million: 0.15
            pricing_date: '2026-10-06'
        ministral-8b-json:
            <<: *ministral_8b
            response_format: { type: json_object }
        gemini-flash-lite-3.5: &gemini_flash_lite_35
            provider: gemini
            transport: gemini
            model: gemini-3.5-flash-lite
            endpoint: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
            api_key: '%env(default:media_comparison.google_key:GEMINI_API_KEY)%'
            input_per_million: 0.30
            cached_input_per_million: 0.03
            output_per_million: 2.50
            pricing_date: '2026-10-06'
        gemini-flash-lite-3.5-json:
            <<: *gemini_flash_lite_35
            response_format: { type: json_object }
    media_comparison.google_key: '%env(default::GOOGLE_API_KEY)%'
