# McpBundle is registered for dev/test only (config/bundles.php) -- an unauthenticated
# MCP endpoint over an app that can write assets and trigger paid AI tasks has no
# business running in prod. The route loader is scoped to match; loading it in prod
# would fail with "no extension able to load the configuration for mcp".
#
# The old `/tools` route pointed at ecourty/mcp-server-bundle's
# `mcp_server.entrypoint_controller`, a package that is no longer installed -- it 500'd
# on every request. symfony/mcp-bundle registers its own route through this loader,
# but only for a server with the http transport enabled; see config/packages/mcp.yaml,
# which also pins the path back to /_mcp (0.13 moved the default to /mcp/<name>).
when@dev:
    mcp:
        resource: mcp
        type: mcp

when@test:
    mcp:
        resource: mcp
        type: mcp
