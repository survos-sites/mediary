# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    # Local addresses never need the dev proxy; going through it turns a
    # same-machine fetch into a 407.
    no_proxy_default: '127.0.0.1,localhost,::1'
    media_canonical_dir_default: '%kernel.project_dir%/var/canonical'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # --- Outbound webhook delivery (see docs/webhooks.md) ---

    # http_client, but routing `.wip` subscribers through the Symfony CLI proxy. Every local
    # client's callback URL is a `.wip` host that resolves nowhere else, so without this the
    # entire local end-to-end path fails — which is the condition media:replay-webhooks was
    # written to clean up after. No $baseUri: one client posts to many different subscribers,
    # so the decision is per request URL.
    survos.webhook.http_client:
        class: Survos\FetchBundle\Http\WipProxyHttpClient
        arguments:
            $client: '@http_client'

    # Symfony's webhook.transport discards the response, so a failed delivery looks identical
    # to a successful one and Messenger never retries. This one reads the status code.
    # monolog-bundle ships no `notifier` handler type, so the bridge's handler is
    # registered as a plain service and referenced by `type: service` above.
    app.monolog.ntfy_handler.inner:
        class: Symfony\Bridge\Monolog\Handler\NotifierHandler
        arguments:
            $notifier: '@notifier'
            $level: !php/const Monolog\Level::Error

    # Wrapped, and built LAZILY. NotifierHandler takes the notifier, and building the
    # notifier resolves every configured DSN -- so an unsupported scheme throws while
    # the container is instantiating this service, before any handler code can catch
    # it. And this handler only runs once something has already failed, which turns
    # every error into a fatal one.
    #
    # That is exactly how a webhook rejected with HTTP 400 took down the `webhook`
    # worker on 2026-09-09: the 400 logged an ERROR, the ERROR reached this handler,
    # ntfy could not be built, and messenger:consume exited 1. Dokku will not promote
    # a release whose processes fail pre-flight, so a broken alerting channel blocked
    # the deploy of the entire application.
    app.monolog.ntfy_handler:
        class: App\Monolog\ResilientNotifierHandler
        arguments:
            $innerFactory: !service_closure '@app.monolog.ntfy_handler.inner'
            $logger: '@logger'
